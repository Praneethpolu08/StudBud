{% include 'main.html' %}

<main class="create-room layout">
<div>
    <div class="container">
        <div class="layout__box">
            <div class="layout__boxHeader">
                <div class="layout__boxTitle">
                    <a href="{% url 'home' %}">
                        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
                             viewBox="0 0 32 32">
                            <title>arrow-left</title>
                            <path
                                    d="M13.723 2.286l-13.723 13.714 13.719 13.714 1.616-1.611-10.96-10.96h27.625v-2.286h-27.625l10.965-10.965-1.616-1.607z">
                            </path>
                        </svg>
                    </a>
                    <h3>Create/Update Study Room</h3>
                </div>
            </div>
            <div class="layout__body">
                <form method="post" class="form" action="">
                    {% csrf_token %}
                    <div class="form__group">
                        <label for="room_topic">Room Topic</label>
                        <input required type="text" name="topic" value="{{ room.topic.name }}" list="topic-list">
                        <datalist id="topic-list">
                            <select name="" id="room_topic">
                                {% for topic in topics %}
                                    <option value="{{ topic.name }}">{{ topic.name }}</option>
                                {% endfor %}
                            </select>
                        </datalist>
                    </div>
                    <div class="form__group">
                        <label for="room_name">Room Name</label>
                        {{ form.name }}
                    </div>
                    <div class="form__group">
                        <label for="room_description">Room Description</label>
                        {{ form.description }}
                    </div>
                    <div class="form__group">
                        <label>Room Visibility</label>
                        <div style="display: flex; gap: 20px;">
                            {% for radio in form.privacy %}
                                <label style="display: flex; align-items: center; gap: 5px;">
                                    {{ radio.tag }} {{ radio.choice_label }}
                                </label>
                            {% endfor %}
                        </div>
                    </div>
                    <!-- 🔐 Password Field (only shows for private) -->
                    <div class="form__group" id="password-field" style="display: none;">
                        <label for="password">Room Password</label>
                        <input type="password" name="password" value="{{ room.password|default_if_none:'' }}">
                    </div>
                    <div class="form__action">
                        <a class="btn btn--dark" href="{% url 'home' %}">Cancel</a>
                        <button class="btn btn--main" type="submit">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
<!-- 🔁 Script to toggle password field -->
<script>
    const radios = document.querySelectorAll('input[name="privacy"]');
    const passwordField = document.getElementById('password-field');

    function togglePasswordField() {
        const selected = document.querySelector('input[name="privacy"]:checked');
        if (selected && selected.value === 'private') {
            passwordField.style.display = 'block';
        } else {
            passwordField.style.display = 'none';
        }
    }

    radios.forEach(radio => radio.addEventListener('change', togglePasswordField));
    window.addEventListener('DOMContentLoaded', togglePasswordField);
</script>
</div>
</main>
